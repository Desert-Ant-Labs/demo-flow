flow: 1
title: Notes from a meeting
description: Writes down a call as it happens, you on the microphone and everyone else from system audio, in any call app, with who said what. Keeps the words, not the recording, and saves each call as a note in the Meeting notes folder.
summary: "Notes from a call, written as you talk."
steps:
  - id: in
    type: call
    with:
      fields:
        - text
        - labeled
        - title
  - id: gist
    type: gist
    uses:
      text: in.text
  - id: notes
    type: template
    uses:
      a: in.title
      b: in.labeled
      c: gist.top
    with:
      template: "# {{a}}\n\n{{date}} at {{time}} · {{c}}\n\n{{b}}"
  - id: save
    type: folder
    uses:
      value: notes.text
      a: in.title
    with:
      folder: Meeting notes
      name: "{{date}} {{a}}"
  - id: show
    type: view
    uses:
      value: notes.text
